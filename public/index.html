<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stomp House</title>
<style>
:root { --ink:#1b1030; --pop:#ffcc33; --pop2:#b07a00; --vio:#7a3cff; --vio2:#4a1fa8; --card:#21154a; }
html, body { margin:0; height:100%; background:#0d0820; overflow:hidden; color:#fff;
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; user-select:none; -webkit-user-select:none; }
#cv { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:block; }
.scr { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; background:rgba(13,8,32,.84); text-align:center; padding:24px; box-sizing:border-box; overflow:auto; }
[hidden] { display:none !important; }
h1 { font-size:clamp(56px,9vw,128px); margin:0; letter-spacing:3px; color:var(--pop); line-height:1;
  text-shadow:0 7px 0 var(--vio),0 12px 40px #000; }
h2 { font-size:clamp(28px,3.6vw,50px); margin:0; }
p { margin:0; font-size:clamp(16px,1.6vw,22px); opacity:.9; }
button { font:inherit; font-weight:700; font-size:clamp(18px,1.7vw,26px); padding:14px 30px; border-radius:16px; border:0;
  background:var(--pop); color:var(--ink); cursor:pointer; box-shadow:0 6px 0 var(--pop2); }
button:hover { filter:brightness(1.08); }
button:active { transform:translateY(3px); box-shadow:0 3px 0 var(--pop2); }
button.alt { background:var(--vio); color:#fff; box-shadow:0 6px 0 var(--vio2); }
button:disabled { opacity:.35; cursor:default; transform:none; }
.row { display:flex; gap:18px; flex-wrap:wrap; justify-content:center; align-items:flex-start; }
.panel { background:var(--card); border-radius:22px; padding:16px 22px 18px; display:flex; flex-direction:column; gap:12px; }
.panel h3 { margin:0; font-size:26px; }
.heroes { display:flex; gap:10px; justify-content:center; }
.hero { background:#2e2160; border:4px solid transparent; border-radius:16px; padding:6px 4px 8px; cursor:pointer;
  width:104px; box-shadow:none; color:#fff; font-size:18px; display:flex; flex-direction:column; align-items:center; gap:2px; }
.hero:active { transform:none; box-shadow:none; }
.hero.sel { border-color:var(--pop); background:#3d2c80; }
.hero:disabled { opacity:.25; }
.hero canvas { width:90px; height:90px; }
.keys { font-size:17px; line-height:1.9; opacity:.92; }
kbd { background:#fff; color:#000; border-radius:6px; padding:1px 8px; font-weight:700; box-shadow:0 2px 0 #999; font-family:inherit; }
.doors { display:flex; gap:26px; flex-wrap:wrap; justify-content:center; }
.door { width:170px; height:250px; padding:0; border-radius:16px 16px 6px 6px; position:relative; color:#fff;
  background:linear-gradient(#7a4426,#55301a); box-shadow:0 8px 0 #2b170c; border:6px solid #3a200f; box-sizing:border-box; }
.door .plq { position:absolute; top:22px; left:50%; transform:translateX(-50%); background:#e9c46a; color:#3a200f;
  border-radius:8px; padding:4px 14px; font-size:24px; box-shadow:0 3px 0 #9b7a2c; white-space:nowrap; }
.door .knob { position:absolute; right:16px; top:130px; width:16px; height:16px; border-radius:50%; background:#ffd36b; }
.door .nm { position:absolute; bottom:-46px; left:-20px; right:-20px; font-size:20px; }
.door .lock { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:56px; }
.door .star { position:absolute; bottom:12px; left:0; right:0; font-size:18px; color:#ffe9a0; }
.doorsWrap { padding-bottom:50px; }
#hudBtns { position:absolute; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:10px; }
#hudBtns button { font-size:17px; padding:8px 16px; border-radius:12px; box-shadow:0 4px 0 var(--vio2); background:var(--vio); color:#fff; }
.tally { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; }
.tcard { background:var(--card); border-radius:20px; padding:16px 26px; min-width:220px; font-size:22px; line-height:1.6; }
.tcard canvas { width:80px; height:80px; }
.crown { color:var(--pop); font-weight:700; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hudBtns" hidden>
  <button id="pauseBtn">⏸ Pause</button>
  <button id="muteBtn">🔊 Sound</button>
</div>

<div id="title" class="scr">
  <h1>STOMP HOUSE</h1>
  <p>Jump, stomp and bonk your way through a spooky old house. Play alone or with a friend!</p>
  <div class="row" style="margin-top:14px">
    <button id="one">1 Player</button>
    <button id="two">2 Players</button>
  </div>
</div>

<div id="pick" class="scr" hidden>
  <h2>Who are you?</h2>
  <div class="row" id="pickPanels"></div>
  <div class="row">
    <button class="alt" id="pickBack">← Back</button>
    <button id="pickGo">Pick a door →</button>
  </div>
</div>

<div id="doorsScr" class="scr" hidden>
  <h2>Pick a door</h2>
  <div class="doors doorsWrap" id="doorList"></div>
  <div class="row"><button class="alt" id="doorsBack">← Change players</button></div>
</div>

<div id="pause" class="scr" hidden>
  <h2>Paused</h2>
  <div class="keys" id="pauseKeys"></div>
  <div class="row">
    <button id="resume">▶ Keep playing</button>
    <button class="alt" id="restart">↺ Start this door over</button>
    <button class="alt" id="toDoors">🚪 Doors</button>
  </div>
</div>

<div id="done" class="scr" hidden>
  <h2 id="doneTitle">Door cleared!</h2>
  <p id="doneSub"></p>
  <div class="tally" id="tally"></div>
  <div class="row">
    <button id="nextDoor">Next door →</button>
    <button class="alt" id="doneDoors">🚪 Doors</button>
  </div>
</div>

<script>
"use strict";
// ---------------------------------------------------------------- setup
const W = 960, H = 540, T = 30, ROWS = 18;
const GRAV = 2000, JUMP = 720, MAXV = 235, STEP = 1 / 120;
const Q = new URLSearchParams(location.search);
const TEST = Q.has("test");
const cv = document.getElementById("cv"), cx = cv.getContext("2d");
let SCALE = 1;
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H), dpr = window.devicePixelRatio || 1;
  SCALE = s * dpr;
  cv.width = Math.round(W * SCALE); cv.height = Math.round(H * SCALE);
  cv.style.width = W * s + "px"; cv.style.height = H * s + "px";
}
addEventListener("resize", fit); fit();
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const over = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

// ---------------------------------------------------------------- save
const SAVE_KEY = TEST ? "stomphouse.test" : "stomphouse.v1";
let save = { open: 1, cleared: [] };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); if (s && s.open) save = s; } catch {}
function store() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch {} }

// ---------------------------------------------------------------- sound
let AC = null, master = null, muted = false;
function ac() {
  try {
    if (!AC) { AC = new AudioContext(); master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination); }
    if (AC.state === "suspended") AC.resume();
  } catch {}
  return AC;
}
function tone(f, d, type = "square", v = 0.12, slide = 0, delay = 0) {
  if (muted || !AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.02);
}
function noise(d, v = 0.15, delay = 0, hi = 1) {
  if (muted || !AC) return;
  const t = AC.currentTime + delay, n = Math.floor(AC.sampleRate * d), buf = AC.createBuffer(1, n, AC.sampleRate), a = buf.getChannelData(0);
  for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(), g = AC.createGain(), fl = AC.createBiquadFilter();
  fl.type = "lowpass"; fl.frequency.value = 900 * hi; s.buffer = buf; g.gain.value = v;
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t);
}
const SFX = {
  jump: () => tone(300, 0.16, "square", 0.06, 2.2),
  stomp: () => { tone(260, 0.12, "square", 0.1, 0.35); noise(0.08, 0.1); },
  boing: () => tone(180, 0.25, "triangle", 0.15, 3),
  candy: () => { tone(988, 0.06, "square", 0.06); tone(1319, 0.18, "square", 0.06, 1, 0.06); },
  power: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.1, "square", 0.07, 1, i * 0.06)),
  hurt: () => { tone(440, 0.3, "sawtooth", 0.08, 0.3); },
  pop: () => { tone(600, 0.2, "triangle", 0.15, 0.25); noise(0.1, 0.08, 0, 3); },
  bump: () => tone(140, 0.08, "square", 0.08, 0.7),
  brk: () => noise(0.25, 0.25, 0, 1.5),
  cp: () => [392, 523, 659].forEach((f, i) => tone(f, 0.15, "triangle", 0.12, 1, i * 0.08)),
  door: () => { tone(110, 0.25, "sawtooth", 0.05, 1.4); },
  throw: () => tone(700, 0.12, "square", 0.05, 0.5),
  rumble: () => { for (let i = 0; i < 6; i++) noise(0.5, 0.18, i * 0.45, 0.25); tone(55, 2.8, "sawtooth", 0.06, 0.8); },
  whoosh: () => { noise(1.2, 0.35, 0, 2); tone(220, 1.1, "sawtooth", 0.07, 0.25); },
  fanfare: () => [523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, i === 6 ? 0.5 : 0.13, "square", 0.08, 1, i * 0.13)),
  boss: () => { tone(90, 0.6, "sawtooth", 0.12, 0.6); noise(0.4, 0.15); },
  bossHit: () => { tone(500, 0.3, "square", 0.1, 0.3); noise(0.2, 0.2); },
};
function sfx(n) { try { SFX[n] && SFX[n](); } catch {} }

// little looping tunes, one per place
const SONGS = {
  yard: { bpm: 132, root: 110, bass: [0, null, 7, null, 0, null, 7, null, 3, null, 10, null, 5, null, 7, null],
    mel: [12, null, 15, null, 19, null, 17, 15, 12, null, null, 10, 12, null, null, null, 15, null, 17, null, 19, null, 22, 19, 17, null, 15, null, 12, null, null, null] },
  hall: { bpm: 100, root: 98, bass: [0, null, null, null, 1, null, null, null, 0, null, null, null, 6, null, 5, null],
    mel: [12, null, null, 13, null, null, 12, null, null, null, 18, null, 17, null, null, null, 12, null, null, 15, null, null, 13, null, 12, null, null, null, null, null, null, null] },
  base: { bpm: 110, root: 87.3, bass: [0, null, 0, null, 3, null, 0, null, 7, null, 6, null, 3, null, null, null],
    mel: [24, null, null, null, null, null, 22, null, null, null, null, null, 19, null, null, null, 24, null, null, null, 27, null, null, null, 26, null, null, null, null, null, null, null] },
  attic: { bpm: 150, root: 110, bass: [0, 0, 12, 0, 0, 12, 0, 10, 0, 0, 12, 0, 3, 5, 7, 10],
    mel: [12, null, 15, 12, 17, null, 15, null, 19, null, 18, null, 17, 15, 12, null, 12, null, 15, 12, 20, null, 19, null, 17, null, 15, null, 14, 15, 12, null] },
};
let song = null, songStep = 0, songNext = 0;
function playSong(name) { song = SONGS[name] || null; songStep = 0; songNext = AC ? AC.currentTime + 0.1 : 0; }
setInterval(() => {
  if (!AC || !song || muted || mode !== "play") { if (AC) songNext = AC.currentTime + 0.05; return; }
  const sp = 60 / song.bpm / 2;
  while (songNext < AC.currentTime + 0.2) {
    const b = song.bass[songStep % song.bass.length], m = song.mel[songStep % song.mel.length];
    const dl = Math.max(0, songNext - AC.currentTime);
    if (b !== null) tone(song.root * 2 ** (b / 12), sp * 0.9, "triangle", 0.07, 1, dl);
    if (m !== null) tone(song.root * 2 * 2 ** (m / 12), sp * 0.8, "square", 0.025, 1, dl);
    songStep++; songNext += sp;
  }
}, 50);

// ---------------------------------------------------------------- heroes
const HEROES = [
  { id: "sprout", name: "Sprout", c: "#4fd16a", d: "#24803b", acc: "leaf" },
  { id: "mitts", name: "Mitts", c: "#ff9a3c", d: "#b85a14", acc: "ears" },
  { id: "zip", name: "Zip", c: "#4aa8ff", d: "#1f5fae", acc: "antenna" },
  { id: "moxie", name: "Moxie", c: "#c07bff", d: "#7440c0", acc: "beanie" },
];
function ell(c, x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); }
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
/** Draws a hero standing with feet at (0,0), about 22 wide and 30 tall. */
function drawHero(c, h, face, t, o = {}) {
  c.save();
  if (o.squish) c.scale(1.3, 0.65);
  const step = o.walk ? Math.sin(t * 16) * 3 : 0, air = o.air;
  c.lineWidth = 2; c.strokeStyle = "#1b1030";
  // feet
  c.fillStyle = "#2a1a3a";
  ell(c, -5 + step, -2 - (air ? 2 : 0), 5.5, 3.2); c.fill();
  ell(c, 5 - step, -2, 5.5, 3.2); c.fill();
  // body
  c.fillStyle = h.c; rr(c, -11, -28, 22, 25, 10); c.fill(); c.stroke();
  c.fillStyle = "rgba(255,255,255,.28)"; ell(c, 0, -10, 6.5, 5.5); c.fill();
  // accessory
  c.fillStyle = h.d;
  if (h.acc === "leaf") {
    c.strokeStyle = h.d; c.beginPath(); c.moveTo(0, -28); c.lineTo(0, -34); c.stroke();
    c.fillStyle = "#7dff8a"; ell(c, 5, -36, 6, 3, -0.5); c.fill(); ell(c, -4, -35, 4.5, 2.4, 0.5); c.fill();
  } else if (h.acc === "ears") {
    c.beginPath(); c.moveTo(-10, -22); c.lineTo(-8, -34); c.lineTo(-2, -27); c.fill();
    c.beginPath(); c.moveTo(10, -22); c.lineTo(8, -34); c.lineTo(2, -27); c.fill();
    c.strokeStyle = "#1b1030"; c.lineWidth = 1;
    c.beginPath(); c.moveTo(face * 4 + 4, -12); c.lineTo(face * 4 + 12, -13); c.moveTo(face * 4 + 4, -10); c.lineTo(face * 4 + 12, -9); c.stroke();
  } else if (h.acc === "antenna") {
    c.strokeStyle = h.d; c.beginPath(); c.moveTo(0, -28); c.lineTo(0, -36); c.stroke();
    c.fillStyle = Math.sin(t * 5) > 0 ? "#ff5a5a" : "#ffe066"; ell(c, 0, -37, 3, 3); c.fill();
  } else if (h.acc === "beanie") {
    rr(c, -11, -31, 22, 8, 4); c.fill();
    c.fillStyle = "#ffe066"; ell(c, 0, -33, 4, 4); c.fill();
  }
  // eyes
  const ex = face * 2;
  c.fillStyle = "#fff"; c.strokeStyle = "#1b1030"; c.lineWidth = 1.5;
  ell(c, -4.5 + ex, -18, 4.3, 5); c.fill(); c.stroke();
  ell(c, 4.5 + ex, -18, 4.3, 5); c.fill(); c.stroke();
  c.fillStyle = "#1b1030";
  if (o.ouch) { c.font = "bold 9px sans-serif"; c.textAlign = "center"; c.fillText("x", -4.5 + ex, -15); c.fillText("x", 4.5 + ex, -15); }
  else { ell(c, -4.5 + ex + face * 1.6, -17.5, 2, 2.6); c.fill(); ell(c, 4.5 + ex + face * 1.6, -17.5, 2, 2.6); c.fill(); }
  // mouth
  c.strokeStyle = "#1b1030"; c.lineWidth = 1.5; c.beginPath(); c.arc(ex, -10, 3, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
  // lantern
  if (o.lantern) {
    const lx = face * 13, ly = -12;
    c.fillStyle = "rgba(255,210,90,.25)"; ell(c, lx, ly, 14, 14); c.fill();
    c.fillStyle = "#6b4a1f"; c.fillRect(lx - 4, ly - 7, 8, 2);
    c.fillStyle = "#ffd75a"; rr(c, lx - 4, ly - 5, 8, 9, 2); c.fill(); c.strokeStyle = "#6b4a1f"; c.lineWidth = 1.2; c.stroke();
  }
  c.restore();
}
function heroThumb(h, size = 90) {
  const c = document.createElement("canvas"), d = window.devicePixelRatio || 1;
  c.width = c.height = size * d; const g = c.getContext("2d");
  g.scale(d * size / 50, d * size / 50); g.translate(25, 44);
  drawHero(g, h, 1, 0, {}); return c;
}

// ---------------------------------------------------------------- levels
function mk(w) { const g = []; for (let y = 0; y < ROWS; y++) g.push(Array(w).fill(".")); return g; }
function put(g, x, y, c) { if (y >= 0 && y < ROWS && x >= 0 && x < g[0].length) g[y][x] = c; }
function fill(g, x0, x1, y0, y1, c) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) put(g, x, y, c); }
function row(g, x, y, s) { for (let i = 0; i < s.length; i++) if (s[i] !== " ") put(g, x + i, y, s[i]); }
function closet(g, x) { fill(g, x, x + 1, 13, 15, "C"); }
function exitDoor(g, x) { fill(g, x, x + 1, 13, 15, "D"); }
function candyLine(E, x0, x1, y) { for (let x = x0; x <= x1; x++) E.push({ t: "candy", tx: x, ty: y }); }
function candyArc(E, x0, n, y) { for (let i = 0; i < n; i++) E.push({ t: "candy", tx: x0 + i, ty: y - Math.round(Math.sin(i / (n - 1) * Math.PI) * 3) }); }

const LEVELS = [
  { name: "The Front Yard", theme: "yard", build() {
    const w = 182, g = mk(w), E = [];
    fill(g, 0, w - 1, 16, 17, "#");
    for (const [a, b] of [[38, 40], [70, 72], [112, 115], [140, 142]]) fill(g, a, b, 16, 17, ".");
    row(g, 14, 12, "B?BLB"); put(g, 16, 8, "?");
    fill(g, 26, 27, 14, 15, "S"); fill(g, 33, 34, 13, 15, "S");
    fill(g, 44, 48, 12, 12, "="); fill(g, 50, 54, 9, 9, "=");
    row(g, 60, 12, "?B?L?");
    row(g, 69, 11, "BB?BB");
    for (let i = 0; i < 4; i++) { fill(g, 80 + i, 80 + i, 15 - i, 15, "S"); fill(g, 86 + i, 86 + i, 12 + i, 15, "S"); }
    row(g, 104, 12, "?B?");
    fill(g, 111, 116, 12, 12, "=");
    fill(g, 125, 127, 15, 15, "^");
    row(g, 132, 12, "?L?");
    for (let i = 0; i < 8; i++) fill(g, 160 + i, 160 + i, 15 - i, 15, "S");
    exitDoor(g, 174);
    E.push({ t: "sign", tx: 6, text: "Jump on baddies! Bonk the ? boxes!" });
    candyLine(E, 9, 12, 14); candyArc(E, 37, 5, 13); candyLine(E, 44, 48, 11); candyLine(E, 50, 54, 8);
    candyArc(E, 69, 5, 13); candyLine(E, 84, 85, 11); candyArc(E, 111, 6, 10); candyArc(E, 124, 5, 12);
    candyArc(E, 139, 5, 13); candyLine(E, 150, 156, 14); candyLine(E, 165, 167, 6);
    for (const x of [22, 30, 46, 58, 66, 76, 98, 108, 120, 136, 146, 150, 155]) E.push({ t: "gourd", tx: x });
    E.push({ t: "bat", tx: 100, ty: 10 }, { t: "bat", tx: 122, ty: 8 }, { t: "bat", tx: 152, ty: 9 });
    E.push({ t: "cp", tx: 93 });
    return { g, E, start: 3 };
  } },
  { name: "The Hallways", theme: "hall", zoomer: true, build() {
    const w = 202, g = mk(w), E = [];
    fill(g, 0, w - 1, 0, 1, "#"); fill(g, 0, w - 1, 16, 17, "#");
    for (const [a, b] of [[54, 56], [120, 122], [160, 162]]) fill(g, a, b, 16, 17, ".");
    for (const x of [12, 26, 40, 49, 64, 78, 91, 106, 116, 132, 146, 156, 172, 186]) closet(g, x);
    for (const x of [20, 33, 44, 70, 85, 99, 111, 138, 151, 178]) fill(g, x, x + 2, 13, 13, "=");
    for (const x of [30, 60, 96, 128, 168]) fill(g, x, x + 1, 13, 15, "S");
    row(g, 16, 11, "?L?"); row(g, 74, 11, "?B?"); put(g, 103, 11, "L"); row(g, 142, 11, "??"); put(g, 182, 11, "L");
    E.push({ t: "sign", tx: 5, text: "Lights flicker? HIDE in a closet! (press down)" });
    candyLine(E, 20, 22, 12); candyLine(E, 33, 35, 12); candyArc(E, 53, 5, 13); candyLine(E, 70, 72, 12);
    candyLine(E, 85, 87, 12); candyArc(E, 119, 5, 13); candyLine(E, 138, 140, 12); candyArc(E, 159, 5, 13);
    candyLine(E, 178, 180, 12); candyLine(E, 190, 194, 14);
    for (const x of [24, 37, 47, 68, 83, 90, 109, 115, 136, 150, 165, 176, 190]) E.push({ t: "gourd", tx: x });
    for (const x of [44, 88, 126, 170]) E.push({ t: "spider", tx: x, ty: 2, len: 9 });
    E.push({ t: "cp", tx: 101 }, { t: "tinker", tx: 66 });
    exitDoor(g, 196);
    return { g, E, start: 3 };
  } },
  { name: "The Basement", theme: "base", dark: true, build() {

// ---------------------------------------------------------------- physics
function moveBody(b, dt, oneway = true) {

  } else if (b.vx < 0) {

    }

  const B = G.boss; if (!B) return;
  B.t += dt; B.inv = Math.max(0, B.inv - dt);
  const top = 95, low = 16 * T - B.h - 2, minX = T + 6, maxX = 31 * T - B.w - 6;
  if (B.st === "intro") {
    B.y += (top - B.y) * Math.min(1, dt * 1.5);
    if (B.t > 2.6) { B.st = "float"; B.t = 0; sfx("boss"); }
  } else if (B.st === "float") {
    const tx = 16 * T - B.w / 2 + Math.sin(B.t * 0.8) * 300;
    B.face = tx > B.x ? 1 : -1;
    B.x += (tx - B.x) * Math.min(1, dt * 3); B.y = top + Math.sin(B.t * 2) * 12;
    B.spawnIn -= dt; B.swoopIn -= dt;
    if (B.spawnIn <= 0) {
      B.spawnIn = B.hp <= 3 ? 2.6 : 3.6;
      if (G.ents.filter(e => e.alive).length < 3) { const d = addEnt({ t: "dust", x: B.x + B.w / 2 - 12, y: B.y + B.h - 30, dir: Math.random() < 0.5 ? -1 : 1 }); d.awake = true; d.vy = -200; }
    }
    if (B.swoopIn <= 0) { B.st = "wind"; B.t = 0; sfx("boss"); }
  } else if (B.st === "wind") {
    if (B.t > 0.9) { B.st = "dive"; B.t = 0; B.vx = B.x + B.w / 2 < 16 * T ? 1 : -1; }
  } else if (B.st === "dive") {
    B.y += (low - B.y) * Math.min(1, dt * 5);
    if (B.t > 0.7) { B.st = "sweep"; B.t = 0; }
  } else if (B.st === "sweep") {
    B.face = B.vx; B.x += B.vx * (B.hp <= 3 ? 300 : 240) * dt;
    if (B.x < minX || B.x > maxX) { B.x = clamp(B.x, minX, maxX); B.st = "rise"; B.t = 0; }
  } else if (B.st === "rise") {
    B.y += (top - B.y) * Math.min(1, dt * 2.5);
    if (B.t > 1.1) { B.st = "float"; B.t = Math.asin(clamp((B.x - (16 * T - B.w / 2)) / 300, -1, 1)) / 0.8; B.swoopIn = rand(4, 6.5); }
  } else if (B.st === "dead") {
    B.y -= 90 * dt; B.x += Math.sin(B.t * 6) * 2;
    return;
  }
  if (B.st === "intro") return;
  for (const p of players) {
    if (p.st !== "play" || !over(p, B)) continue;
    if (p.vy > 0 && p.pb <= B.y + 34) { p.vy = -680; if (B.inv <= 0) hitBoss(2, p); else sfx("boing"); }
    else if (B.inv <= 0) hurt(p, false);
  }
}

function finishLevel(p) {

  if (!save.cleared.includes(G.li)) save.cleared.push(G.li);
  save.open = Math.max(save.open, Math.min(LEVELS.length, G.li + 2)); store();
  setTimeout(() => showDone(), TEST ? 50 : 900);
}

function step(dt) {
  G.t += dt; G.banner -= dt; G.shake = Math.max(0, G.shake - dt * 20);
  for (const [k, v] of G.bumps) { if (v - dt <= 0) G.bumps.delete(k); else G.bumps.set(k, v - dt); }
  for (const r of G.refills) { r.t -= dt; if (r.t <= 0 && G.grid[r.ty][r.tx] === "u") { G.grid[r.ty][r.tx] = "L"; burst(r.tx * T + 15, r.ty * T + 15, "#ffd75a", 8, 120, 0.4, 3); } }
  G.refills = G.refills.filter(r => r.t > 0);
  if (G.finished) return;
  players.forEach((p, i) => stepPlayer(p, dt, readInput(i)));
  HIT.clear();
  stepEnts(dt);
  collide(dt);
  if (G.def.zoomer) stepZoomer(dt);
  if (G.def.boss) stepBoss(dt);
  for (const it of G.items) if (it.fall) { it.vy += 900 * dt; it.y += it.vy * dt; const gr = 16 * T - it.h - 2; if (it.y > gr) { it.y = gr; it.fall = false; } }
  if (players.length > 1 && players.every(p => p.st === "bubble") && players.some(p => p.bt > 0.8)) respawnAll();
  // camera
  const act = players.filter(p => p.st !== "bubble");
  if (act.length) {
    let tx = act.reduce((s, p) => s + p.x, 0) / act.length - W / 2 + 10;
    if (act.length === 1) tx += act[0].face * 60;
    tx = clamp(tx, 0, G.w * T - W);
    const minX = Math.min(...act.map(p => p.x)), maxX = Math.max(...act.map(p => p.x + p.w));
    tx = clamp(tx, maxX - W + 40, minX - 40);
    tx = clamp(tx, 0, G.w * T - W);
    G.cam += (tx - G.cam) * Math.min(1, dt * 6);
  }
  for (const pt of G.parts) { pt.life -= dt; if (pt.t === "popcandy") { pt.vy += 900 * dt; pt.y += pt.vy * dt; } else { pt.vy += 700 * dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt; } }
  G.parts = G.parts.filter(pt => pt.life > 0);
}

      b.disabled = NPLAYERS > 1 && picks[1 - i] === k;
      b.append(heroThumb(h)); b.append(h.name);
      b.onclick = () => { picks[i] = k; buildPick(); };
      hs.append(b);
    });
    pan.append(hs);
    const k = document.createElement("div"); k.className = "keys"; k.innerHTML = keysHTML(i); pan.append(k);
    wrap.append(pan);
  }
}
function buildDoors() {
  const list = $("doorList"); list.innerHTML = "";
  LEVELS.forEach((L, i) => {
    const b = document.createElement("button"); b.className = "door"; b.dataset.door = i + 1;
    const open = i < save.open || TEST && Q.has("all");
    b.disabled = !open;
    b.innerHTML = `<span class="plq">Door ${i + 1}</span><span class="knob"></span>${open ? "" : '<span class="lock">🔒</span>'}${save.cleared.includes(i) ? '<span class="star">★ cleared</span>' : ""}<span class="nm">${L.name}</span>`;
    b.onclick = () => { ac(); startLevel(i); };
    list.append(b);
  });
}
function togglePause() {
  if (mode === "play") { mode = "pause"; $("pauseKeys").innerHTML = players.map((p, i) => (NPLAYERS > 1 ? `<b>${p.hero.name}:</b> ` : "") + keysHTML(i)).join("<br><br>"); showOnly("pause"); }
  else if (mode === "pause") { mode = "play"; showOnly(null); last = performance.now(); }
}
function toMenu(id) { mode = "menu"; $("hudBtns").hidden = true; showOnly(id); }
function showDone() {
  mode = "done"; $("hudBtns").hidden = true;
  const boss = G.def.boss, lastLvl = G.li === LEVELS.length - 1;
  $("doneTitle").textContent = boss ? "You beat the Landlord!" : `Door ${G.li + 1} cleared!`;
  $("doneSub").textContent = boss ? "Stomp House is yours. Nice teamwork!" : `Next up: Door ${G.li + 2}, ${LEVELS[G.li + 1].name}`;
  const top = Math.max(...players.map(p => p.candy));
  const t = $("tally"); t.innerHTML = "";
  players.forEach(p => {
    const d = document.createElement("div"); d.className = "tcard";
    d.append(heroThumb(p.hero, 80));
    d.insertAdjacentHTML("beforeend", `<div><b>${p.hero.name}</b></div><div>🍬 ${p.candy} candy</div><div>👟 ${p.stomps} stomps</div>${players.length > 1 && p.candy === top && top > 0 ? '<div class="crown">👑 Candy champ!</div>' : ""}`);
    t.append(d);
  });
  $("nextDoor").hidden = lastLvl;
  showOnly("done");
}
$("one").onclick = () => { ac(); NPLAYERS = 1; buildPick(); showOnly("pick"); };
$("two").onclick = () => { ac(); NPLAYERS = 2; if (picks[0] === picks[1]) picks[1] = (picks[0] + 1) % 4; buildPick(); showOnly("pick"); };
$("pickBack").onclick = () => showOnly("title");
$("pickGo").onclick = () => { buildDoors(); showOnly("doorsScr"); };
$("doorsBack").onclick = () => { buildPick(); showOnly("pick"); };
$("resume").onclick = togglePause;
$("restart").onclick = () => startLevel(G.li);
$("toDoors").onclick = () => { buildDoors(); toMenu("doorsScr"); };
$("pauseBtn").onclick = () => { $("pauseBtn").blur(); togglePause(); };
$("muteBtn").onclick = () => { muted = !muted; $("muteBtn").textContent = muted ? "🔇 Sound" : "🔊 Sound"; $("muteBtn").blur(); };
$("nextDoor").onclick = () => startLevel(G.li + 1);
$("doneDoors").onclick = () => { buildDoors(); toMenu("doorsScr"); };
// keep the keyboard on the game after clicking a button
document.addEventListener("click", e => { if (e.target.closest("button") && mode === "play") e.target.closest("button").blur(); });

// ---------------------------------------------------------------- test hooks
if (TEST) window.__sh = {
  get G() { return G; }, get players() { return players; }, get mode() { return mode; }, LEVELS, FAKE,
  start(li, n = 2) { NPLAYERS = n; picks = [0, 2]; startLevel(li); },
  sim(sec) { const n = Math.round(sec / STEP); for (let i = 0; i < n && mode === "play"; i++) step(STEP); },
  set god(v) { window.__god = v; },
};
</script>
</body>
